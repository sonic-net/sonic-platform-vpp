parameters:
  - name: debian_version
    type: string
    default: trixie
  - name: arch
    type: string
    default: amd64

jobs:
  - job:
    displayName: amd64-${{ parameters.debian_version }}
    timeoutInMinutes: 300
    container:
      image: sonicdev-microsoft.azurecr.io:443/sonic-slave-${{ parameters.debian_version }}:latest
      # --privileged grants capabilities to root only, so the steps must also
      # run as root: the VPP test suite needs CAP_SYS_ADMIN to create the
      # network namespaces the custom plugin tests rely on.
      options:  "--privileged --user 0:0"
    steps:
    - checkout: self
      clean: true
    - task: DownloadPipelineArtifact@2
      inputs:
        source: specific
        project: build
        pipeline: Azure.sonic-buildimage.common_libs
        runVersion: 'latestFromBranch'
        runBranch: 'refs/heads/$(BUILD_BRANCH)'
        path: $(Build.ArtifactStagingDirectory)/download
        artifact: common-lib
        patterns: |
            target/debs/${{ parameters.debian_version }}/libnl-3*.deb
            target/debs/${{ parameters.debian_version }}/libnl-genl*.deb
            target/debs/${{ parameters.debian_version }}/libnl-route*.deb
            target/debs/${{ parameters.debian_version }}/libnl-nf*.deb
      displayName: "Download common libs"
    - script: |
        set -ex
        echo "BUILD_BRANCH: $(BUILD_BRANCH)"
        # install libyang before install libswsscommon
        sudo dpkg -i $(find ./download -name *.deb)
        rm -rf download || true
        cat /etc/apt/sources.list
        dpkg --list |grep libnl
      workingDirectory: $(Build.ArtifactStagingDirectory)
      displayName: "Install libnl3"
    - script: |
        set -ex
        cd $(System.DefaultWorkingDirectory)/vppbld
        make ci-build CONFIGURED_ARCH=${{ parameters.arch }} CI_DEST=$(System.DefaultWorkingDirectory)/vppbld/artifacts
      displayName: "Build VPP packages from source"
    # The custom plugin suites self-skip when namespaces cannot be created,
    # which would leave the job green while testing nothing.  "make ci-test"
    # gates on this too, but probing here fails fast with an attributable
    # step instead of surfacing after a long test run.
    - script: |
        set -ex
        id
        capsh --print || true
        ip netns del ci_netns_probe 2>/dev/null || true
        ip netns add ci_netns_probe
        ip netns del ci_netns_probe
      displayName: "Verify network namespace capability"
    # Runs the upstream VPP suite plus the tests shipped by our custom plugins
    # (vppbld/plugins/tests/<plugin>/), passed to the runner via EXTERN_TESTS.
    - script: |
        set -ex
        cd $(System.DefaultWorkingDirectory)/vppbld
        make ci-test CONFIGURED_ARCH=${{ parameters.arch }} \
          CI_DEST=$(System.DefaultWorkingDirectory)/vppbld/artifacts \
          CI_TEST_LOGS=$(System.DefaultWorkingDirectory)/vppbld/test-logs
      displayName: "Run VPP make test"
    # Logs of failing test cases (gzipped log.txt / vpp_stderr.txt / pcaps).
    # The directory is created unconditionally so the publish below cannot
    # fail when an earlier step, rather than the tests, is what broke.
    - script: |
        set -ex
        mkdir -p $(System.DefaultWorkingDirectory)/vppbld/test-logs
        ls -lR $(System.DefaultWorkingDirectory)/vppbld/test-logs || true
      displayName: "Collect failed VPP test logs"
      condition: failed()
    - publish: $(System.DefaultWorkingDirectory)/vppbld/test-logs
      artifact: vpp-test-logs-${{ parameters.debian_version }}
      displayName: "Archive failed VPP test logs"
      condition: failed()
    - publish: $(System.DefaultWorkingDirectory)/vppbld/artifacts
      artifact: vpp-${{ parameters.debian_version }}
      displayName: "Archive vpp debian packages"
