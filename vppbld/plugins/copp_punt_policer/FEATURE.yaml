---
name: CoPP Punt Policer
maintainer: SONiC-VPP contributors
features:
  - Applies per-ethertype rate policing to control-plane traffic on the
    device-input feature arc, before ethernet-input's protocol dispatch
    runs. This closes a gap left by VPP's existing classify-based
    policer-classify feature, which only runs on l2-input (bridged L2
    traffic), ip4-unicast, and ip6-unicast -- arcs that ARP, LACP, LLDP,
    and UDLD traffic never traverses on linux-cp-paired, L3-routed
    ports (they are dispatched directly from ethernet-input to
    arp-input/linux-cp-punt-xc and punted straight to the interface's
    TAP).
  - Reuses VPP's existing policer objects and metering primitive
    (vnet_police_packet()) -- no new token-bucket implementation.
    Policer objects are created/updated by external control-plane code
    exactly as before (e.g. via policer_add); this plugin only adds a
    second, additional consulting point for those same objects on
    control-plane ethertypes that would otherwise never reach a
    policer at all.
  - Binding an ethertype to a policer is done via a small VPP binary
    API (copp_punt_policer_bind) or the "copp punt policer bind"
    debug CLI; the feature auto-enables on device-input for every
    interface as it is created, so no per-interface enable step is
    needed once at least one binding exists.
  - Per-binding conform/exceed/violate packet counters are exposed via
    copp_punt_policer_get_counters (API) or "show copp punt policer"
    (CLI).
description: "Per-ethertype punt policing on device-input, for SONiC/VPP CoPP"
state: experimental
