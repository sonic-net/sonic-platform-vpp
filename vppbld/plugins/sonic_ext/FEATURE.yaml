name: sonic_ext
maintainer: SONiC-VPP contributors
features:
  - punt-via-member: redirect punted unicast/ARP over aggregated interface (BVI, Bond) to the original member tap
  - host-xc: bypass ethernet-input for packets injected from the linux-cp host tap
  - copp-ifout: per-ethertype CoPP rate policing (ARP, LACP, LLDP, UDLD,
    TTL_ERROR) on the interface-output arc of every linux-cp host TAP --
    only meters traffic already decided to be punted, never ordinary
    forwarded traffic
  - copp-ip2me: CoPP rate policing for IP2ME/SNMP/SSH traffic on the
    global ip4-punt arc, ahead of ip4-punt-redirect
description: "VPP extensions for SONiC features"
state: experimental
properties: [API, CLI]
